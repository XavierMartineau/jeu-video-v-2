<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#101928" />
    <title>Afterlight // Mission 01</title>
    <link rel="stylesheet" href="src/styles/main.css" />
  </head>
  <body>
    <main class="game-shell">
      <header class="topbar">
        <a class="brand-mark" href="index.html" aria-label="Retour à l'accueil">
          <span class="brand-dot"></span><span>AFTERLIGHT // ZERO DAY</span>
        </a>
        <div class="topbar-note">RELAY 01 / DEAD CITY PERIMETER</div>
      </header>
      <section class="game-frame" aria-label="Mission Afterlight Zero Day">
        <canvas id="game" width="1280" height="720"></canvas>
        <div id="end-screen" class="screen-panel hidden">
          <p id="end-kicker" class="eyebrow">MISSION ACCOMPLIE</p>
          <h2 id="end-title">Relais rallumé.</h2>
          <p id="end-copy">Le signal traverse enfin la ville morte.</p>
          <button id="restart-button" class="primary-button">
            REJOUER <span>↻</span>
          </button>
        </div>
        <div class="hud" aria-live="polite">
          <div class="hud-group">
            <span class="hud-label">VITALITÉ</span>
            <span id="hearts" class="hearts">♥ ♥ ♥</span>
          </div>
          <div class="hud-group score-group">
            <span class="hud-label">FRAGMENTS</span>
            <strong id="score">000000</strong>
          </div>
          <div class="hud-group progress-group">
            <span class="hud-label">DISTANCE</span>
            <div class="progress-track"><span id="progress"></span></div>
          </div>
        </div>
      </section>
      <nav class="mobile-controls" aria-label="Contrôles tactiles">
        <button
          class="control-button"
          data-control="left"
          aria-label="Aller à gauche"
        >
          ←
        </button>
        <button
          class="control-button jump-control"
          data-control="jump"
          aria-label="Sauter"
        >
          ↑
        </button>
        <button
          class="control-button"
          data-control="right"
          aria-label="Aller à droite"
        >
          →
        </button>
      </nav>
      <footer class="footer-line">
        <a href="index.html">← RETOUR AU RELAIS</a>
        <span>SCAVENGE / RUN / SURVIVE</span>
        <span>BEST RUN: <b id="best-score">000000</b></span>
      </footer>
    </main>
    <script src="src/game.js"></script>
  </body>
</html>
